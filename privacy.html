      min-height: 100vh;
      overflow-x: hidden;
    }

    .cloud {
      position: fixed;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      filter: blur(1px);
      z-index: 0;
      pointer-events: none;
    }

    .cloud.c1 { width: 220px; height: 68px; top: 88px; left: -60px; }
    .cloud.c2 { width: 300px; height: 86px; top: 210px; right: -110px; }
    .cloud.c3 { width: 180px; height: 58px; bottom: 90px; left: 8%; opacity: .55; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -1px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--purple), var(--pink));
      box-shadow: 0 12px 30px rgba(123, 112, 255, .28);
    }

    .brand-title {
      font-weight: 850;
      font-size: 18px;
      line-height: 1.05;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    select, .nav a {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 13px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(73, 88, 160, 0.08);
      backdrop-filter: blur(14px);
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero {
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 46px);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -70px;
      top: -70px;
      background: radial-gradient(circle, rgba(255,201,74,.42), transparent 67%);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(91,188,255,.45);
      background: rgba(232, 247, 255, .75);
      color: #2370a7;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      letter-spacing: -2px;
      line-height: .96;
    }

    .lead {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
      max-width: 760px;
    }

    .card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.70);
      backdrop-filter: blur(20px);
      border-radius: 26px;
      box-shadow: 0 18px 50px rgba(73, 88, 160, 0.12);
      padding: clamp(20px, 3vw, 32px);
      margin: 16px 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 25px;
      letter-spacing: -.5px;
    }

    h3 {
      margin: 22px 0 8px;
      font-size: 18px;
    }

    p, li {
      color: var(--muted);
      line-height: 1.65;
      font-size: 15.8px;
    }

    ul { padding-left: 20px; }

    a { color: #5a56d6; font-weight: 750; }

    .notice {
      border-left: 5px solid var(--blue);
      background: rgba(232, 247, 255, .72);
      padding: 14px 16px;
      border-radius: 16px;
      color: #235b78;
      margin-top: 12px;
      line-height: 1.6;

    footer {
      color: var(--muted);
      text-align: center;
      padding: 22px 0 8px;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; width: 100%; }
      select { width: 100%; }
      .nav a { flex: 1; text-align: center; }

    const select = document.getElementById("langSelect");
    Object.entries(LANGS).forEach(([code, label]) => {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = label;
      select.appendChild(option);
    });

    function getInitialLang() {
      const saved = localStorage.getItem("rps_lang");
      if (saved && DATA[saved]) return saved;
      const browser = (navigator.language || "en").slice(0, 2);
      return DATA[browser] ? browser : "en";
    }

    function render(lang) {
      const data = DATA[lang] || DATA.en;
      document.documentElement.lang = lang;
      document.getElementById("badge").textContent = data.badge;
      document.getElementById("title").textContent = data.title;
      document.getElementById("subtitle").textContent = data.subtitle;
      document.getElementById("content").innerHTML = data.html;
      select.value = lang;
      localStorage.setItem("rps_lang", lang);
    }

    select.addEventListener("change", (e) => render(e.target.value));
    document.getElementById("year").textContent = new Date().getFullYear();
    render(getInitialLang());
  </script>
